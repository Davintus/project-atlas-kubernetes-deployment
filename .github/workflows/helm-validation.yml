name: Validate Helm chart and Mifos image

on:
  push:
    branches:
      - docs/sanitised-project-baseline
    paths:
      - "helm/**"
      - "k8s/**"
      - "scripts/**"
      - "nginx/**"
      - "frontend/**"
      - "Dockerfile.mifos"
      - "docs/build-provenance.md"
      - ".github/workflows/helm-validation.yml"
      - ".github/workflows/helm-kind-smoke.yml"
  pull_request:
    paths:
      - "helm/**"
      - "k8s/**"
      - "scripts/**"
      - "nginx/**"
      - "frontend/**"
      - "Dockerfile.mifos"
      - "docs/build-provenance.md"
      - ".github/workflows/helm-validation.yml"
      - ".github/workflows/helm-kind-smoke.yml"

permissions:
  contents: read

jobs:
  helm:
    name: Lint, render and smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0

      - name: Check shell syntax
        run: |
          bash -n scripts/build-fineract-image.sh
          bash -n scripts/build-mifos-image.sh
          bash -n scripts/validate-mifos-frontend.sh
          bash -n scripts/import-mifos-frontend.sh
          sh -n nginx/docker-entrypoint.sh

      - name: Render Kustomize overlays
        run: |
          for overlay in development staging production; do
            echo "Rendering Kustomize overlay: $overlay"
            kubectl kustomize "k8s/overlays/$overlay" > "/tmp/$overlay-rendered.yaml"
            test -s "/tmp/$overlay-rendered.yaml"
          done

      - name: Validate Mifos frontend distribution when present
        run: |
          if [ ! -s frontend/index.html ]; then
            echo "Historical Mifos frontend is not yet imported; image build will be skipped."
            exit 0
          fi
          bash scripts/validate-mifos-frontend.sh frontend

      - name: Build and smoke-test Mifos frontend when present
        run: |
          if [ ! -s frontend/index.html ]; then
            echo "Historical Mifos distribution is not yet imported; skipping image build."
            exit 0
          fi

          docker build --pull -f Dockerfile.mifos -t project-atlas/mifos-web:ci .
          docker run -d --name project-atlas-mifos-ci -p 127.0.0.1:18080:8080 project-atlas/mifos-web:ci

          cleanup() { docker rm -f project-atlas-mifos-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/ >/dev/null; then
              break
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:18080/ >/dev/null
          docker exec project-atlas-mifos-ci test -s /usr/share/nginx/html/assets/env.js
          docker exec project-atlas-mifos-ci sh -c '! grep -Eq "\\$[A-Z][A-Z0-9_]*" /usr/share/nginx/html/assets/env.js'
          docker exec project-atlas-mifos-ci sh -c 'grep -Fq "https://fineract.example.invalid" /usr/share/nginx/html/assets/env.js'

      - name: Lint chart
        run: helm lint helm/fineract-mifos

      - name: Render default values
        run: helm template project-atlas helm/fineract-mifos --namespace project-atlas

      - name: Render development values
        run: helm template project-atlas helm/fineract-mifos --namespace project-atlas -f helm/fineract-mifos/values/development.yaml

      - name: Render staging values
        run: helm template project-atlas helm/fineract-mifos --namespace project-atlas -f helm/fineract-mifos/values/staging.yaml

      - name: Render production example values
        run: helm template project-atlas helm/fineract-mifos --namespace project-atlas -f helm/fineract-mifos/values/production.example.yaml
