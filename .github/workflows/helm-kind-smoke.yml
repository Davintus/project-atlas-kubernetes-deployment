name: Helm install and service smoke test

on:
  push:
    branches:
      - docs/sanitised-project-baseline
    paths:
      - "helm/**"
      - ".github/workflows/helm-kind-smoke.yml"
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/helm-kind-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind-install:
    name: Install, verify, upgrade and rollback on kind
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Create disposable Kubernetes cluster
        uses: helm/kind-action@v1.12.0

      - name: Create namespace and synthetic database Secret
        run: |
          kubectl create namespace atlas-smoke
          kubectl create secret generic fineract-db-credentials \
            --namespace atlas-smoke \
            --from-literal=DB_HOST=mariadb.test.invalid \
            --from-literal=DB_PORT=3306 \
            --from-literal=DEFAULT_DB=fineract_default_test \
            --from-literal=DB_USER=smoke_user \
            --from-literal=DB_PASSWORD=smoke_only_not_a_real_password \
            --from-literal=TENANTS_JDBC_URL=jdbc:mariadb://mariadb.test.invalid:3306/fineract_tenants_test

      - name: Prepare smoke-test overrides
        run: |
          cat > /tmp/values-kind.yaml <<'YAML'
          api:
            image:
              repository: busybox
              tag: "1.36.1"
              pullPolicy: IfNotPresent
            command: ["sh"]
            args:
              - "-c"
              - "while true; do nc -l -p 8443; done"
            readinessProbe:
              tcpSocket:
                port: https
              initialDelaySeconds: 2
              periodSeconds: 2
              timeoutSeconds: 1
              failureThreshold: 10
            livenessProbe:
              tcpSocket:
                port: https
              initialDelaySeconds: 5
              periodSeconds: 5
              timeoutSeconds: 1
              failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 64Mi
          frontend:
            image:
              repository: nginx
              tag: "1.28-alpine"
              pullPolicy: IfNotPresent
            containerPort: 80
            service:
              type: ClusterIP
              port: 80
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 64Mi
          ingress:
            enabled: false
          YAML

      - name: Install chart and wait for both workloads
        run: |
          helm upgrade --install atlas-smoke helm/fineract-mifos \
            --namespace atlas-smoke \
            --values /tmp/values-kind.yaml \
            --wait \
            --timeout 180s

          kubectl rollout status deployment/atlas-smoke-fineract-mifos-api \
            --namespace atlas-smoke --timeout=180s
          kubectl rollout status deployment/atlas-smoke-fineract-mifos-frontend \
            --namespace atlas-smoke --timeout=180s

      - name: Verify in-cluster Service connectivity
        run: |
          kubectl run atlas-service-check \
            --namespace atlas-smoke \
            --image=busybox:1.36.1 \
            --restart=Never \
            --rm -i \
            --command -- sh -ec \
            'wget -q -O /dev/null http://atlas-smoke-fineract-mifos-frontend:80/ && nc -z atlas-smoke-fineract-mifos-api 8443'

      - name: Verify Helm upgrade
        run: |
          helm upgrade atlas-smoke helm/fineract-mifos \
            --namespace atlas-smoke \
            --values /tmp/values-kind.yaml \
            --set api.replicaCount=2 \
            --wait \
            --timeout 180s

          test "$(kubectl get deployment atlas-smoke-fineract-mifos-api \
            --namespace atlas-smoke -o jsonpath='{.spec.replicas}')" = "2"

      - name: Verify Helm rollback
        run: |
          helm rollback atlas-smoke 1 \
            --namespace atlas-smoke \
            --wait \
            --timeout 180s

          test "$(kubectl get deployment atlas-smoke-fineract-mifos-api \
            --namespace atlas-smoke -o jsonpath='{.spec.replicas}')" = "1"

      - name: Collect diagnostic state
        if: always()
        run: |
          kubectl get pods,deployments,services -n atlas-smoke || true
          helm history atlas-smoke -n atlas-smoke || true
