name: Secret and Git history scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secret-history-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan all fetched refs and commit history
    runs-on: ubuntu-latest
    steps:
      - name: Check out all branches, tags and commit history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks and run event scan
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Scan commits reachable from every fetched ref
        shell: bash
        run: |
          set -Eeuo pipefail
          gitleaks git \
            --log-opts="--all" \
            --redact \
            --exit-code=2 \
            --report-format=sarif \
            --report-path="$RUNNER_TEMP/gitleaks-all-refs.sarif" \
            .

      - name: Summarise secret scan boundary
        if: success()
        run: |
          {
            echo "## Secret scan"
            echo
            echo "- Gitleaks scanned the git history reachable from all refs fetched by actions/checkout with fetch-depth: 0."
            echo "- The scan report is redacted and is not uploaded as an artifact."
            echo "- A clean result does not replace manual disclosure review or credential rotation."
          } >> "$GITHUB_STEP_SUMMARY"
