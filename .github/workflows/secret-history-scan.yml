name: Secret and Git history scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: secret-history-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan all fetched refs and commit history
    runs-on: ubuntu-latest
    steps:
      - name: Check out all branches, tags and commit history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks and run event scan
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Scan commits reachable from every fetched ref
        shell: bash
        run: |
          set -Eeuo pipefail

          set +e
          gitleaks git \
            --log-opts="--all" \
            --redact \
            --exit-code=2 \
            --report-format=sarif \
            --report-path="$RUNNER_TEMP/gitleaks-all-refs.sarif" \
            .
          scan_status=$?
          set -e

          # Print finding metadata only. Never print the matched secret or source line.
          if [ -s "$RUNNER_TEMP/gitleaks-all-refs.sarif" ]; then
            jq -c '
              .runs[]?.results[]? |
              {
                rule: (.ruleId // "unknown-rule"),
                file: (.locations[0].physicalLocation.artifactLocation.uri // "unknown-file"),
                line: (.locations[0].physicalLocation.region.startLine // 0),
                commit: (.partialFingerprints.commitSha // "unknown-commit")
              }
            ' "$RUNNER_TEMP/gitleaks-all-refs.sarif" > "$RUNNER_TEMP/gitleaks-findings-metadata.jsonl"

            if [ -s "$RUNNER_TEMP/gitleaks-findings-metadata.jsonl" ]; then
              echo "Gitleaks finding metadata (redacted; values omitted):"
              cat "$RUNNER_TEMP/gitleaks-findings-metadata.jsonl"
              {
                echo "## Gitleaks finding metadata (redacted)"
                echo
                echo "| Rule | File | Line | Commit |"
                echo "|---|---|---:|---|"
                while read -r record; do
                  rule="$(jq -r '.rule' <<< "$record")"
                  file="$(jq -r '.file' <<< "$record")"
                  line="$(jq -r '.line' <<< "$record")"
                  commit="$(jq -r '.commit' <<< "$record")"
                  printf '| %s | `%s` | %s | `%s` |\n' "$rule" "$file" "$line" "$commit"
                done < "$RUNNER_TEMP/gitleaks-findings-metadata.jsonl"
                echo
                echo "Matched values and source lines are intentionally not printed."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Gitleaks SARIF report contains no parseable result records, or the report file was not generated."
            fi
          fi

          exit "$scan_status"

      - name: Summarise secret scan boundary
        if: always()
        run: |
          {
            echo "## Secret scan boundary"
            echo
            echo "- Gitleaks scanned the git history reachable from all refs fetched by actions/checkout with fetch-depth: 0."
            echo "- The report is redacted; only rule, path, line and commit metadata are included above."
            echo "- A clean result does not replace manual disclosure review or credential rotation."
          } >> "$GITHUB_STEP_SUMMARY"
